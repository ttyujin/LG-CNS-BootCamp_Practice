<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Script</title>
    </head>

    <body>

        <script>
            /*
            script(interpriter) 
            변수 - 데이터를 담는 그릇
            - 변수의 타입이 존재하지 않는다(es6 var, let, const).(type script) 
            - 실행시점(변수에 값이 할당되는 시점)에 변수의 타입이 묵시적으로 할당 
            - 기본타입(숫자, 문자(열), 논리, null, undefined)
            - 참조타입(Object, Array, Function, etc.....)  -> Object
            - 흐름제어구문, 반복구문
            - 함수(Function)
            */
            var message = "script" ; 
            console.log(`debug >>>> message = ${message}`) ; 
            console.log(`debug >>>> message type ${ typeof message}`) ; 

            message = 10 ; 
            console.log(`debug >>>> message = ${message}`) ; 
            console.log(`debug >>>> message type ${ typeof message}`) ; 
            console.log(`debug >>>> message ==  ${ message == "10" }`) ; 
            console.log(`debug >>>> message === ${ message === "10" }`) ; 

            let msg = "let 키워드를 이용하면 중복 변수 선언을 방지할 수 있습니다." ;
            // let msg = 10 ; 
            console.log(`debug >>>> const 상수는 값을 재 할당할 수 없습니다.`) ; 
            const num = 10 ; 
            // num = 20 ; 

            console.log(`debug >>>> 스크립트에서 가장 많이 사용하는 변수의 타입 - Object`) ; 
            console.log(`debug >>>> script object === json(rest api {key:value} )`) ; 
            let obj = { 
                name  : "jslim" ,
                age   : 20,
                major : "cs" 
            }; 
            console.log("debug >>>> obj value ", obj) ;  
            console.log("debug >>>> obj type  ", typeof obj) ;  
            console.log("debug >>>> obj property  ", obj.major) ;
            console.log("debug >>>> obj property  ", obj['major']) ;
            
            console.log(`debug >>>> 스크립트 객체를 담는 변수의 타입 [] - Array`) ; 
            let ary = [
                { name : "inspire"}, 
                { name : "lgcns"}, 
                { name : "am"}, 
                { name : "camp6th"}
            ];
            console.log("debug >>>> array value  ", ary) ;  
            console.log("debug >>>> array type   ", typeof ary) ;  
            console.log("debug >>>> array index  ", ary[0].name) ; 
            console.log(`debug >>>> array index   ${ary[3].name}`) ; 
            // console.log("debug >>>> obj property  ", obj['major']) ;
            console.log("debug >>>> array function : map(), filter() , forEach() ") ;   
            
        </script>
    </body>
</html>
