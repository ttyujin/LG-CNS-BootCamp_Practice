<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="../css/coffee.css" rel="stylesheet">        
</head>
<body>
    
    <div>
        <h1>Inspire Coffee</h1>
        <img    src="../img/coffee-blue.jpg"
                width="200"
                height="200"> 
    </div>
    <div>
        <!-- <button 
                type="button" 
                onclick="handler('Lgcns Coffee', 'coffee-pink.jpg')">
                헤딩과 이미지의 속성을 변경
            </button>     -->
        <button type="button" id="btn">Inspire Coffee</button>
    </div>

    <script>
        /*
        Q)
        - step01 : 버튼의 이벤트를 감지하는 함수정의
        - step02 : 이벤트 발생시 h1, img 태그에 접근하여
        - step03 : 이미지 src 속성에 접근하여  coffee-pink.jpg 변경 
        - step04 : h1 접근해서 텍스트를  Lgcns Coffee 변경 
        - 필요에 따라서 태그에 선택자를 정의할 수 있음.
        - 혹, 토클버튼으로 구현할려면 버튼의 caption 도 변경

        hint) 
        특정영역에 text 삽입시 : textContent, innerHTML, innerText 

        - step05 : 테스트 완료되면 ai agent 도움을 받아서 css 작성하고 꾸미기 
        */

        // let btn = document.querySelector('#btn') ;
        // console.log(`debug >>>> btn ${btn}` , btn ); 
        document.querySelector('#btn').onclick = (e) => {
            console.log(`debug >>>> btn caption` , e.target.textContent ); 
            if(e.target.textContent === 'Inspire Coffee') {
                let h1  = document.querySelector('body > div > h1') ;
                let img = document.querySelector('body > div > img') ;
                h1.textContent = "Lgcns Coffee" ;
                img.src = `../img/coffee-pink.jpg` ;
                e.target.textContent = "Lgcns Coffee" ;
            } else { 
                let h1  = document.querySelector('body > div > h1') ;
                let img = document.querySelector('body > div > img') ;
                h1.textContent = "Inspire Coffee" ;
                img.src = `../img/coffee-blue.jpg` ;
                e.target.textContent = "Inspire Coffee" ;
            }
        };

    </script>
</body>
</html>
